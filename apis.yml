description: Grafana Labs builds the open and composable observability stack used by millions of engineers
  to visualize, query, alert on, and explore their metrics, logs, traces, and profiles. The flagship Grafana
  OSS dashboarding platform is paired with Grafana Loki (logs), Grafana Mimir (Prometheus-compatible metrics),
  Grafana Tempo (distributed traces), and Grafana Pyroscope (continuous profiling) — all under the LGTM
  stack. Grafana Cloud delivers the entire portfolio as a managed SaaS with a generous free tier, while
  Grafana Enterprise extends self-managed deployments with premium plugins, reporting, RBAC, LBAC, and
  caching. The ecosystem extends to Grafana k6 (load testing), Grafana Alloy (OpenTelemetry-native collector),
  Grafana Beyla (eBPF auto-instrumentation), Grafana Faro (frontend observability), Grafana OnCall (incident
  response), and Synthetic Monitoring. A canonical OpenAPI specification at public/api-merged.json powers
  the official Go client, the Terraform provider, the Grafana Operator, and a deep dashboards-as-code
  toolchain (Foundation SDK, Grafonnet, Grizzly, Scenes).
