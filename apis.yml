- aid: grafana-com:grafana-com-folders-api
  name: Grafana Folders API
  description: 'Folders are identified by the identifier (id) and the unique identifier (uid).

    The identifier (id) of a folder is an auto-incrementing numeric value and is only unique per Grafana
    install.

    The unique identifier (uid) of a folder can be used for uniquely identify folders between multiple
    Grafana installs. It’s automatically generated if not provided when creating a folder. The uid allows
    having consistent URLs for accessing folders and when syncing folders between multiple Grafana installs.
    This means that changing the title of a folder will not break any bookmarked links to that folder.

    The uid can have a maximum length of 40 characters.'
