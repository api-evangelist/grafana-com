    put:
      tags:
      - Provisioning
      summary: Create or update alert rule group
      operationId: RoutePutAlertRuleGroup
      deprecated: true
      parameters:
      - name: X-Disable-Provenance
        in: header
        schema:
          type: string
      - name: FolderUID
        in: path
        required: true
        schema:
          type: string
      - name: Group
        in: path
