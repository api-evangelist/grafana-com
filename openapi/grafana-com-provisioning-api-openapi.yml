      responses:
        '202':
          description: EmbeddedContactPoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedContactPoint'
        '400':
          description: ValidationError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: PublicError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedContactPoint'
  /v1/provisioning/contact-points/export:
    get:
      tags:
      - Provisioning
      summary: Export all contact points in provisioning file format
      operationId: RouteGetContactpointsExport
      parameters:
      - description: Whether to initiate a download of the file or not.
        name: download
        in: query
        schema:
          type: boolean
          default: false
      - description: Format of the downloaded file. Supported yaml, json or hcl. Accept header can also be used, but the query parameter will take precedence.
        name: format
        in: query
        schema:
          type: string
          enum:
          - yaml
          - json
          - hcl
          default: yaml
      - description: Whether any contained secure settings should be decrypted or left redacted. Redacted settings will contain RedactedValue instead. Currently, only org admin can view decrypted secure settings.
        name: decrypt
        in: query
        schema:
          type: boolean
          default: false
      - description: Filter by name
        name: name
        in: query
        schema:
          type: string
      responses:
        '200':
          description: AlertingFileExport
          content:
            application/json:
              schema:
