        in: path
        required: true
        schema:
          type: string
      - description: Version of mute timing to use for optimistic concurrency. Leave empty to disable validation
        name: version
        in: query
        schema:
          type: string
      - name: X-Disable-Provenance
        in: header
        schema:
          type: string
      responses:
        '204':
