openapi: 3.2.0
info:
  description: 'The Grafana backend exposes an HTTP API, the same API is used by the frontend to do

    everything from saving dashboards, creating users and updating data sources.'
  title: Grafana HTTP API. Provisioning API
  contact:
    name: Grafana Labs
    url: https://grafana.com
    email: hello@grafana.com
  version: 0.0.1
servers:
- url: /api
security:
- basic: []
- api_key: []
tags:
- name: Provisioning
paths:
  /v1/provisioning/alert-rules:
    get:
      tags:
      - Provisioning
      summary: Get all the alert rules
      operationId: RouteGetAlertRules
      deprecated: true
      responses:
        '200':
          description: ProvisionedAlertRules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedAlertRules'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
    post:
      tags:
      - Provisioning
      summary: Create a new alert rule
      operationId: RoutePostAlertRule
      deprecated: true
      parameters:
      - name: X-Disable-Provenance
        in: header
        schema:
          type: string
      responses:
        '201':
          description: ProvisionedAlertRule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedAlertRule'
        '400':
          description: ValidationError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionedAlertRule'
  /v1/provisioning/alert-rules/export:
    get:
      tags:
      - Provisioning
      summary: Export all alert rules in provisioning file format
      operationId: RouteGetAlertRulesExport
      parameters:
      - description: Whether to initiate a download of the file or not.
        name: download
        in: query
        schema:
          type: boolean
          default: false
      - description: Format of the downloaded file. Supported yaml, json or hcl. Accept header can also be used, but the query parameter will take precedence.
        name: format
        in: query
        schema:
          type: string
          enum:
          - yaml
          - json
          - hcl
          default: yaml
      - description: UIDs of folders from which to export rules
        name: folderUid
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Name of group of rules to export. Must be specified only together with a single folder UID
        name: group
        in: query
        schema:
          type: string
      - description: UID of alert rule to export. If specified, parameters folderUid and group must be empty.
        name: ruleUid
        in: query
        schema:
          type: string
      responses:
        '200':
          description: AlertingFileExport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            application/terraform+hcl:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            text/yaml:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            text/hcl:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            application/terraform+hcl:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            text/hcl:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: ' Not found.'
  /v1/provisioning/alert-rules/{UID}:
    get:
      tags:
      - Provisioning
      summary: Get a specific alert rule by UID
      operationId: RouteGetAlertRule
      deprecated: true
      parameters:
      - description: Alert rule UID
        name: UID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ProvisionedAlertRule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedAlertRule'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: ' Not found.'
    put:
      tags:
      - Provisioning
      summary: Update an existing alert rule
      operationId: RoutePutAlertRule
      deprecated: true
      parameters:
      - description: Alert rule UID
        name: UID
        in: path
        required: true
        schema:
          type: string
      - name: X-Disable-Provenance
        in: header
        schema:
          type: string
      responses:
        '200':
          description: ProvisionedAlertRule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedAlertRule'
        '400':
          description: ValidationError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionedAlertRule'
    delete:
      tags:
      - Provisioning
      summary: Delete a specific alert rule by UID
      operationId: RouteDeleteAlertRule
      deprecated: true
      parameters:
      - description: Alert rule UID
        name: UID
        in: path
        required: true
        schema:
          type: string
      - name: X-Disable-Provenance
        in: header
        schema:
          type: string
      responses:
        '204':
          description: ' The alert rule was deleted successfully.'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /v1/provisioning/alert-rules/{UID}/export:
    get:
      tags:
      - Provisioning
      summary: Export an alert rule in provisioning file format
      operationId: RouteGetAlertRuleExport
      parameters:
      - description: Whether to initiate a download of the file or not.
        name: download
        in: query
        schema:
          type: boolean
          default: false
      - description: Format of the downloaded file. Supported yaml, json or hcl. Accept header can also be used, but the query parameter will take precedence.
        name: format
        in: query
        schema:
          type: string
          enum:
          - yaml
          - json
          - hcl
          default: yaml
      - description: Alert rule UID
        name: UID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: AlertingFileExport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            application/yaml:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            application/terraform+hcl:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            text/yaml:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
            text/hcl:
              schema:
                $ref: '#/components/schemas/AlertingFileExport'
        '403':
          description: ForbiddenError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            application/terraform+hcl:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            text/yaml:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
            text/hcl:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: ' Not found.'
  /v1/provisioning/contact-points:
    get:
      tags:
      - Provisioning
      summary: Get all the contact points
      operationId: RouteGetContactpoints
      deprecated: true
      parameters:
      - description: Filter by name
