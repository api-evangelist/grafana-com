openapi: 3.2.0
info:
  description: 'The Grafana backend exposes an HTTP API, the same API is used by the frontend to do

    everything from saving dashboards, creating users and updating data sources.'
  title: Grafana HTTP API. Dashboards API
  contact:
    name: Grafana Labs
    url: https://grafana.com
    email: hello@grafana.com
  version: 0.0.1
servers:
- url: /api
security:
- basic: []
- api_key: []
tags:
- name: Dashboards
paths:
  /dashboard/snapshots:
    get:
      tags:
      - Dashboards
      summary: List snapshots
      operationId: searchDashboardSnapshots
      parameters:
      - description: Search Query
        name: query
        in: query
        schema:
          type: string
      - description: Limit the number of returned results
        name: limit
        in: query
        schema:
          type: integer
          format: int64
          default: 1000
      responses:
        '200':
          $ref: '#/components/responses/searchDashboardSnapshotsResponse'
        '500':
          $ref: '#/components/responses/internalServerError'
  /dashboards/db:
    post:
      description: 'Creates a new dashboard or updates an existing dashboard.

        Note: This endpoint is not intended for creating folders, use `POST /api/folders` for that.


        Use: /apis/dashboard.grafana.app/v1/namespaces/{ns}/dashboards'
      tags:
      - Dashboards
      summary: Create / Update dashboard
      operationId: postDashboard
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/postDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '412':
          $ref: '#/components/responses/preconditionFailedError'
        '422':
          $ref: '#/components/responses/unprocessableEntityError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDashboardCommand'
        required: true
  /dashboards/home:
    get:
      description: 'NOTE: the home dashboard is configured in preferences. This API will be removed in G13'
      tags:
      - Dashboards
      operationId: getHomeDashboard
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/getHomeDashboardResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get home dashboard
      x-summary-source: derived
  /dashboards/import:
    post:
      tags:
      - Dashboards
      summary: Import dashboard
      operationId: importDashboard
      responses:
        '200':
          $ref: '#/components/responses/importDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '412':
          $ref: '#/components/responses/preconditionFailedError'
        '422':
          $ref: '#/components/responses/unprocessableEntityError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDashboardRequest'
        required: true
  /dashboards/interpolate:
    post:
      tags:
      - Dashboards
      summary: Interpolate dashboard.
      operationId: interpolateDashboard
      responses:
        '200':
          $ref: '#/components/responses/interpolateDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '422':
          $ref: '#/components/responses/unprocessableEntityError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /dashboards/public-dashboards:
    get:
      description: Get list of public dashboards
      tags:
      - Dashboards
      operationId: listPublicDashboards
      responses:
        '200':
          $ref: '#/components/responses/listPublicDashboardsResponse'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      summary: List public dashboards
      x-summary-source: derived
  /dashboards/tags:
    get:
      tags:
      - Dashboards
      summary: Get all dashboards tags of an organization
      operationId: getDashboardTags
      deprecated: true
      responses:
        '200':
          $ref: '#/components/responses/getDashboardsTagsResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /dashboards/uid/{dashboardUid}/public-dashboards:
    get:
      description: Get public dashboard by dashboardUid
      tags:
      - Dashboards
      operationId: getPublicDashboard
      parameters:
      - name: dashboardUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getPublicDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestPublicError'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '404':
          $ref: '#/components/responses/notFoundPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      summary: Get public dashboard
      x-summary-source: derived
    post:
      description: Create public dashboard for a dashboard
      tags:
      - Dashboards
      operationId: createPublicDashboard
      parameters:
      - name: dashboardUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/createPublicDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestPublicError'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicDashboardDTO'
        required: true
      summary: Create public dashboard
      x-summary-source: derived
  /dashboards/uid/{dashboardUid}/public-dashboards/{uid}:
    delete:
      description: Delete public dashboard for a dashboard
      tags:
      - Dashboards
      operationId: deletePublicDashboard
      parameters:
      - name: dashboardUid
        in: path
        required: true
        schema:
          type: string
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestPublicError'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      summary: Delete public dashboard
      x-summary-source: derived
    patch:
      description: Update public dashboard for a dashboard
      tags:
      - Dashboards
      operationId: updatePublicDashboard
      parameters:
      - name: dashboardUid
        in: path
        required: true
        schema:
          type: string
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/updatePublicDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestPublicError'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicDashboardDTO'
        required: true
      summary: Update public dashboard
      x-summary-source: derived
  /dashboards/uid/{uid}:
    get:
      description: 'Optional query parameter `apiVersion` selects the Kubernetes API version used to load the dashboard first

        (for example `v1beta1`). If that request fails, the default version is used instead. When omitted, only the default is used.


        Will return the dashboard given the dashboard unique identifier (uid).


        Use: /apis/dashboard.grafana.app/v1/namespaces/{ns}/dashboards/{uid}'
      tags:
      - Dashboards
      summary: Get dashboard by uid
      operationId: getDashboardByUID
      deprecated: true
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/dashboardResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '406':
          $ref: '#/components/responses/notAcceptableError'
        '500':
          $ref: '#/components/responses/internalServerError'
    delete:
      description: 'Will delete the dashboard given the specified unique identifier (uid).


        Use: /apis/dashboard.grafana.app/v1/namespaces/{ns}/dashboards/{uid}'
      tags:
      - Dashboards
      summary: Delete dashboard by uid
      operationId: deleteDashboardByUID
      deprecated: true
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/deleteDashboardResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /dashboards/uid/{uid}/permissions:
    get:
      description: 'Use: /apis/dashboard.grafana.app/v1/namespaces/{ns}/dashboards/{uid}/access'
      tags:
      - Dashboards
      summary: Gets all existing permissions for the given dashboard
      operationId: getDashboardPermissionsListByUID
      deprecated: true
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getDashboardPermissionsListResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    post:
      description: This operation will remove existing permissions if they’re not included in the request.
      tags:
      - Dashboards
      summary: Updates permissions for a dashboard
      operationId: updateDashboardPermissionsByUID
      deprecated: true
      parameters:
      - description: The dashboard UID
        name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardACLCommand'
        required: true
  /dashboards/uid/{uid}/restore:
    post:
      description: 'This API will be removed when /apis/dashboard.grafana.app/v1 is released.

        You can restore a dashboard by reading it from history, then creating it again.'
      tags:
      - Dashboards
      summary: Restore a dashboard to a given dashboard version using UID
      operationId: restoreDashboardVersionByUID
      deprecated: true
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/postDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreDashboardVersionCommand'
        required: true
  /dashboards/uid/{uid}/versions:
    get:
      tags:
      - Dashboards
      summary: Gets all existing versions for the dashboard using UID
      operationId: getDashboardVersionsByUID
      deprecated: true
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      - description: Maximum number of results to return
        name: limit
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - description: Version to start from when returning queries
        name: start
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        '200':
          $ref: '#/components/responses/dashboardVersionsResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /dashboards/uid/{uid}/versions/{DashboardVersionID}:
    get:
      tags:
      - Dashboards
      summary: Get a specific dashboard version using UID
      operationId: getDashboardVersionByUID
      deprecated: true
      parameters:
      - name: DashboardVersionID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/dashboardVersionResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /public/dashboards/{accessToken}:
    get:
      description: Get public dashboard for view
      tags:
      - Dashboards
      operationId: viewPublicDashboard
      parameters:
      - name: accessToken
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/viewPublicDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestPublicError'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '404':
          $ref: '#/components/responses/notFoundPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      summary: View public dashboard
      x-summary-source: derived
  /public/dashboards/{accessToken}/annotations:
    get:
      description: Get annotations for a public dashboard
      tags:
      - Dashboards
      operationId: getPublicAnnotations
      parameters:
      - name: accessToken
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getPublicAnnotationsResponse'
        '400':
          $ref: '#/components/responses/badRequestPublicError'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '404':
          $ref: '#/components/responses/notFoundPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      summary: Get public annotations
      x-summary-source: derived
  /public/dashboards/{accessToken}/panels/{panelId}/query:
    post:
      description: Get results for a given panel on a public dashboard
      tags:
      - Dashboards
      operationId: queryPublicDashboard
      parameters:
      - name: accessToken
        in: path
        required: true
        schema:
          type: string
      - name: panelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/queryPublicDashboardResponse'
        '400':
          $ref: '#/components/responses/badRequestPublicError'
        '401':
          $ref: '#/components/responses/unauthorisedPublicError'
        '403':
          $ref: '#/components/responses/forbiddenPublicError'
        '404':
          $ref: '#/components/responses/notFoundPublicError'
        '500':
          $ref: '#/components/responses/internalServerPublicError'
      summary: Query public dashboard
      x-summary-source: derived
  /snapshots:
    post:
      description: Snapshot public mode should be enabled or authentication is required.
      tags:
      - Dashboards
      summary: When creating a snapshot using the API, you have to provide the full dashboard…
      operationId: createDashboardSnapshot
      responses:
        '200':
          $ref: '#/components/responses/createDashboardSnapshotResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardSnapshotCommand'
        required: true
  /snapshots-delete/{deleteKey}:
    get:
      description: Snapshot public mode should be enabled or authentication is required.
      tags:
      - Dashboards
      summary: Delete Snapshot by deleteKey
      operationId: deleteDashboardSnapshotByDeleteKey
      parameters:
      - name: deleteKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /snapshots/{key}:
    get:
      tags:
      - Dashboards
      summary: Get Snapshot by Key
      operationId: getDashboardSnapshot
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getDashboardSnapshotResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    delete:
      tags:
      - Dashboards
      summary: Delete Snapshot by Key
      operationId: deleteDashboardSnapshot
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
components:
  schemas:
    Json:
      type: object
    Source:
      type: string
      title: Source type defines the status source.
    AnnotationPermission:
      type: object
      properties:
        dashboard:
          $ref: '#/components/schemas/AnnotationActions'
    Frame:
      description: 'Each Field is well typed by its FieldType and supports optional Labels.


        A Frame is a general data container for Grafana. A Frame can be table data

        or time series data depending on its content and field types.'
      type: object
      title: Frame is a columnar data structure where each column is a Field.
      properties:
        Fields:
          description: 'Fields are the columns of a frame.

            All Fields must be of the same the length when marshalling the Frame for transmission.

            There should be no `nil` entries in the Fields slice (making them pointers was a mistake).'
          type: array
          items:
            $ref: '#/components/schemas/Field'
        Meta:
          $ref: '#/components/schemas/FrameMeta'
        Name:
          description: Name is used in some Grafana visualizations.
          type: string
        RefID:
          description: RefID is a property that can be set to match a Frame to its originating query.
          type: string
    SuccessResponseBody:
      type: object
      properties:
        message:
          type: string
    DashboardaccessPermissionType:
      type: integer
      format: int64
    PublicDashboardListResponse:
      type: object
      properties:
        accessToken:
          type: string
        dashboardUid:
          type: string
        isEnabled:
          type: boolean
        slug:
          type: string
        title:
          type: string
        uid:
          type: string
    DataSourceRef:
      description: Ref to a DataSource instance
      type: object
      properties:
        type:
          description: The plugin type-id
          type: string
        uid:
          description: Specific datasource instance
          type: string
    Unstructured:
      description: 'Unstructured allows objects that do not have Golang structs registered to be manipulated

        generically.'
      type: object
      properties:
        Object:
          description: 'Object is a JSON compatible map with string, float, int, bool, []any,

            or map[string]any children.'
          type: object
          additionalProperties: {}
    QueryStat:
      description: 'The embedded FieldConfig''s display name must be set.

        It corresponds to the QueryResultMetaStat on the frontend (https://github.com/grafana/grafana/blob/master/packages/grafana-data/src/types/data.ts#L53).'
      type: object
      title: QueryStat is used for storing arbitrary statistics metadata related to a query and its result, e.g. total request time, data processing time.
      properties:
        color:
          description: 'Map values to a display color

            NOTE: this interface is under development in the frontend... so simple map for now'
          type: object
          additionalProperties: {}
        custom:
          description: Panel Specific Values
          type: object
          additionalProperties: {}
        decimals:
          type: integer
          format: uint16
        description:
          description: Description is human readable field metadata
          type: string
        displayName:
          description: DisplayName overrides Grafana default naming, should not be used from a data source
          type: string
        displayNameFromDS:
          description: DisplayNameFromDS overrides Grafana default naming strategy.
          type: string
        filterable:
          description: Filterable indicates if the Field's data can be filtered by additional calls.
          type: boolean
        interval:
          description: 'Interval indicates the expected regular step between values in the series.

            When an interval exists, consumers can identify "missing" values when the expected value is not present.

            The grafana timeseries visualization will render disconnected values when missing values are found it the time field.

            The interval uses the same units as the values.  For time.Time, this is defined in milliseconds.'
          type: number
          format: double
        links:
          description: The behavior when clicking on a result
          type: array
          items:
            $ref: '#/components/schemas/DataLink'
        mappings:
          $ref: '#/components/schemas/ValueMappings'
        max:
          $ref: '#/components/schemas/ConfFloat64'
        min:
          $ref: '#/components/schemas/ConfFloat64'
        noValue:
          description: Alternative to empty string
          type: string
        path:
          description: 'Path is an explicit path to the field in the datasource. When the frame meta includes a path,

            this will default to `${frame.meta.path}/${field.name}


            When defined, this value can be used as an identifier within the datasource scope, and

            may be used as an identifier to update values in a subsequent request'
          type: string
        thresholds:
          $ref: '#/components/schemas/ThresholdsConfig'
        type:
          $ref: '#/components/schemas/FieldTypeConfig'
        unit:
          description: Numeric Options
          type: string
        value:
          type: number
          format: double
        writeable:
          description: Writeable indicates that the datasource knows how to update this value
          type: boolean
    ImportDashboardInput:
      type: object
      title: ImportDashboardInput definition of input parameters when importing a dashboard.
      properties:
        name:
          type: string
        pluginId:
          type: string
        type:
          type: string
        value:
          type: string
    GetHomeDashboardResponse:
      title: Get home dashboard response.
      allOf:
      - type: object
        properties:
          dashboard:
            $ref: '#/components/schemas/Json'
          meta:
            $ref: '#/components/schemas/DashboardMeta'
      - type: object
        properties:
          redirectUri:
            type: string
    ImportDashboardResponse:
      type: object
      title: ImportDashboardResponse response object returned when importing a dashboard.
      properties:
        dashboardId:
          type: integer
          format: int64
        description:
          type: string
        folderId:
          description: 'Deprecated: use FolderUID instead'
          type: integer
          format: int64
          x-deprecated: true
        folderUid:
          type: string
