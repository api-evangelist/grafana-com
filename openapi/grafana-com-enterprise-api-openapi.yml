openapi: 3.2.0
info:
  description: 'The Grafana backend exposes an HTTP API, the same API is used by the frontend to do

    everything from saving dashboards, creating users and updating data sources.'
  title: Grafana HTTP API. Enterprise API
  contact:
    name: Grafana Labs
    url: https://grafana.com
    email: hello@grafana.com
  version: 0.0.1
servers:
- url: /api
security:
- basic: []
- api_key: []
tags:
- description: These are only available in Grafana Enterprise
  name: Enterprise
paths:
  /access-control/roles:
    get:
      description: 'Gets all existing roles. The response contains all global and organization local roles, for the organization which user is signed in.


        You need to have a permission with action `roles:read` and scope `roles:*`.


        The `delegatable` flag reduces the set of roles to only those for which the signed-in user has permissions to assign.'
      tags:
      - Enterprise
      summary: Get all roles
      operationId: listRoles
      parameters:
      - name: delegatable
        in: query
        schema:
          type: boolean
      - name: includeHidden
        in: query
        schema:
          type: boolean
      - name: targetOrgId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/listRolesResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    post:
      description: 'Creates a new custom role and maps given permissions to that role. Note that roles with the same prefix as Fixed Roles can’t be created.


        You need to have a permission with action `roles:write` and scope `permissions:type:delegate`. `permissions:type:delegate` scope ensures that users can only create custom roles with the same, or a subset of permissions which the user has.

        For example, if a user does not have required permissions for creating users, they won’t be able to create a custom role which allows to do that. This is done to prevent escalation of privileges.'
      tags:
      - Enterprise
      summary: Create a new custom role
      operationId: createRole
      responses:
        '201':
          $ref: '#/components/responses/createRoleResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleForm'
        required: true
  /access-control/roles/{roleUID}:
    get:
      description: 'Get a role for the given UID.


        You need to have a permission with action `roles:read` and scope `roles:*`.'
      tags:
      - Enterprise
      summary: Get a role
      operationId: getRole
      parameters:
      - name: roleUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getRoleResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: You need to have a permission with action `roles:write` and scope `permissions:type:delegate`. `permissions:type:delegate` scope ensures that users can only update custom roles with permissions which the user has.
      tags:
      - Enterprise
      summary: Update a custom role
      operationId: updateRole
      parameters:
      - name: roleUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getRoleResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleCommand'
        required: true
    delete:
      description: 'Delete a role with the given UID, and it’s permissions. If the role is assigned to a built-in role, the deletion operation will fail, unless force query param is set to true, and in that case all assignments will also be deleted.


        You need to have a permission with action `roles:delete` and scope `permissions:type:delegate`.'
      tags:
      - Enterprise
      summary: Delete a custom role
      operationId: deleteRole
      parameters:
      - name: force
        in: query
        schema:
          type: boolean
      - name: global
        in: query
        schema:
          type: boolean
      - name: roleUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/roles/{roleUID}/assignments:
    get:
      description: 'Get role assignments for the role with the given UID.

        Does not include role assignments mapped through group attribute sync.


        You need to have a permission with action `teams.roles:list` and scope `teams:id:*` and `users.roles:list` and scope `users:id:*`.'
      tags:
      - Enterprise
      summary: Get role assignments
      operationId: getRoleAssignments
      parameters:
      - name: roleUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getRoleAssignmentsResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: 'Set role assignments for the role with the given UID.


        You need to have a permission with action `teams.roles:add` and `teams.roles:remove` and scope `permissions:type:delegate`, and `users.roles:add` and `users.roles:remove` and scope `permissions:type:delegate`.'
      tags:
      - Enterprise
      summary: Set role assignments
      operationId: setRoleAssignments
      parameters:
      - name: roleUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/setRoleAssignmentsResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleAssignmentsCommand'
        required: true
  /access-control/status:
    get:
      description: 'Returns an indicator to check if fine-grained access control is enabled or not.


        You need to have a permission with action `status:accesscontrol` and scope `services:accesscontrol`.'
      tags:
      - Enterprise
      summary: Get status
      operationId: getAccessControlStatus
      responses:
        '200':
          $ref: '#/components/responses/getAccessControlStatusResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/teams/roles/search:
    post:
      description: 'Lists the roles that have been directly assigned to the given teams.


        You need to have a permission with action `teams.roles:read` and scope `teams:id:*`.'
      tags:
      - Enterprise
      summary: List roles assigned to multiple teams
      operationId: listTeamsRoles
      responses:
        '200':
          $ref: '#/components/responses/listTeamsRolesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesSearchQuery'
        required: true
  /access-control/teams/{teamId}/roles:
    get:
      description: You need to have a permission with action `teams.roles:read` and scope `teams:id:`.
      tags:
      - Enterprise
      summary: Get team roles
      operationId: listTeamRoles
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: targetOrgId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: You need to have a permission with action `teams.roles:add` and `teams.roles:remove` and scope `permissions:type:delegate` for each. The delegate scope is required for permissions on roles being added.
      tags:
      - Enterprise
      summary: Update team role
      operationId: setTeamRoles
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: targetOrgId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTeamRolesCommand'
        required: true
    post:
      description: You need to have a permission with action `teams.roles:add` and scope `permissions:type:delegate`.
      tags:
      - Enterprise
      summary: Add team role
      operationId: addTeamRole
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTeamRoleCommand'
        required: true
  /access-control/teams/{teamId}/roles/{roleUID}:
    delete:
      description: You need to have a permission with action `teams.roles:remove` and scope `permissions:type:delegate`.
      tags:
      - Enterprise
      summary: Remove team role
      operationId: removeTeamRole
      parameters:
      - name: roleUID
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /access-control/users/roles/search:
    post:
      description: 'Lists the roles that have been directly assigned to the given users. The list does not include built-in roles (Viewer, Editor, Admin or Grafana Admin), and it does not include roles that have been inherited from a team.


        You need to have a permission with action `users.roles:read` and scope `users:id:*`.'
      tags:
      - Enterprise
      summary: List roles assigned to multiple users
      operationId: listUsersRoles
      responses:
        '200':
          $ref: '#/components/responses/listUsersRolesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesSearchQuery'
        required: true
  /access-control/users/{userId}/roles:
    get:
      description: 'Lists the roles that have been directly assigned to a given user. The list does not include built-in roles (Viewer, Editor, Admin or Grafana Admin), and it does not include roles that have been inherited from a team.


        You need to have a permission with action `users.roles:read` and scope `users:id:`.'
      tags:
      - Enterprise
      summary: List roles assigned to a user
      operationId: listUserRoles
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: includeHidden
        in: query
        schema:
          type: boolean
      - name: targetOrgId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/getAllRolesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      description: 'Update the user’s role assignments to match the provided set of UIDs. This will remove any assigned roles that aren’t in the request and add roles that are in the set but are not already assigned to the user.

        Roles mapped through group attribute sync are not impacted.

        If you want to add or remove a single role, consider using Add a user role assignment or Remove a user role assignment instead.


        You need to have a permission with action `users.roles:add` and `users.roles:remove` and scope `permissions:type:delegate` for each. The delegate scope is required for permissions on roles being added.'
      tags:
      - Enterprise
      summary: Set user role assignments
      operationId: setUserRoles
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: targetOrgId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserRolesCommand'
        required: true
    post:
      description: 'Assign a role to a specific user. For bulk updates consider Set user role assignments.


        You need to have a permission with action `users.roles:add` and scope `permissions:type:delegate`. `permissions:type:delegate` scope ensures that users can only assign roles which have same, or a subset of permissions which the user has. For example, if a user does not have required permissions for creating users, they won’t be able to assign a role which will allow to do that. This is done to prevent escalation of privileges.'
      tags:
      - Enterprise
      summary: Add a user role assignment
      operationId: addUserRole
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRoleCommand'
        required: true
  /access-control/users/{userId}/roles/{roleUID}:
    delete:
      description: 'Revoke a role from a user. For bulk updates consider Set user role assignments.


        You need to have a permission with action `users.roles:remove` and scope `permissions:type:delegate`.'
      tags:
      - Enterprise
      summary: Remove a user role assignment
      operationId: removeUserRole
      parameters:
      - description: A flag indicating if the assignment is global or not. If set to false, the default org ID of the authenticated user will be used from the request to remove assignment.
        name: global
        in: query
        schema:
          type: boolean
      - name: roleUID
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/okResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /admin/ldap-sync-status:
    get:
      description: You need to have a permission with action `ldap.status:read`.
      tags:
      - Enterprise
      summary: Returns the current state of the LDAP background sync integration
      operationId: getSyncStatus
      responses:
        '200':
          $ref: '#/components/responses/getSyncStatusResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /admin/provisioning/access-control/reload:
    post:
      tags:
      - Enterprise
      summary: You need to have a permission with action `provisioning:reload` with scope…
      operationId: adminProvisioningReloadAccessControl
      responses:
        '202':
          $ref: '#/components/responses/acceptedResponse'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
  /datasources/uid/{uid}/lbac/teams:
    get:
      tags:
      - Enterprise
      summary: Retrieves LBAC rules for a team
      operationId: getTeamLBACRulesApi
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/getTeamLBACRulesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
    put:
      tags:
      - Enterprise
      summary: Updates LBAC rules for a team
      operationId: updateTeamLBACRulesApi
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/updateTeamLBACRulesResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorisedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamLBACCommand'
  /datasources/{dataSourceUID}/cache:
    get:
      description: get cache config for a single data source
      tags:
      - Enterprise
      operationId: getDataSourceCacheConfig
      parameters:
      - name: dataSourceUID
        in: path
        required: true
        schema:
          type: string
      - description: Optional datasource type used to disambiguate datasource UID lookups.
        name: dataSourceType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheConfigResponse'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Get data source cache config
      x-summary-source: derived
    post:
      description: set cache config for a single data source
      tags:
      - Enterprise
      operationId: setDataSourceCacheConfig
      parameters:
      - name: dataSourceUID
        in: path
        required: true
        schema:
          type: string
      - description: Optional datasource type used to disambiguate datasource UID lookups.
        name: dataSourceType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheConfigResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '500':
          $ref: '#/components/responses/internalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheConfigSetter'
        required: true
      summary: Set data source cache config
      x-summary-source: derived
  /datasources/{dataSourceUID}/cache/clean:
    post:
      description: clean cache for a single data source
      tags:
      - Enterprise
      operationId: cleanDataSourceCache
      parameters:
      - name: dataSourceUID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheConfigResponse'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Clean data source cache
      x-summary-source: derived
  /datasources/{dataSourceUID}/cache/disable:
    post:
      description: disable cache for a single data source
      tags:
      - Enterprise
      operationId: disableDataSourceCache
      parameters:
      - name: dataSourceUID
        in: path
        required: true
        schema:
          type: string
      - description: Optional datasource type used to disambiguate datasource UID lookups.
        name: dataSourceType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheConfigResponse'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Disable data source cache
      x-summary-source: derived
  /datasources/{dataSourceUID}/cache/enable:
    post:
      description: enable cache for a single data source
      tags:
      - Enterprise
      operationId: enableDataSourceCache
      parameters:
      - name: dataSourceUID
        in: path
        required: true
        schema:
          type: string
      - description: Optional datasource type used to disambiguate datasource UID lookups.
        name: dataSourceType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheConfigResponse'
        '500':
          $ref: '#/components/responses/internalServerError'
      summary: Enable data source cache
      x-summary-source: derived
  /licensing/check:
    get:
      tags:
      - Enterprise
      summary: Check license availability
      operationId: getStatus
      responses:
        '200':
          $ref: '#/components/responses/getStatusResponse'
  /licensing/custom-permissions:
    get:
      description: 'You need to have a permission with action `licensing.reports:read`.


        Deprecated. There is currently no replacement for this endpoint. Please reach out to Grafana support if you rely on this endpoint.'
      tags:
      - Enterprise
      summary: Get custom permissions report
      operationId: getCustomPermissionsReport
      deprecated: true
      responses:
        '500':
          $ref: '#/components/responses/internalServerError'
  /licensing/custom-permissions-csv:
    get:
      description: 'You need to have a permission with action `licensing.reports:read`.


        Deprecated. There is currently no replacement for this endpoint. Please reach out to Grafana support if you rely on this endpoint.'
      tags:
      - Enterprise
      summary: Get custom permissions report in CSV format
      operationId: getCustomPermissionsCSV
      deprecated: true
      responses:
        '500':
          $ref: '#/components/responses/internalServerError'
  /licensing/refresh-stats:
    get:
      description: You need to have a permission with action `licensing:read`.
      tags:
      - Enterprise
      summary: Refresh license stats
      operationId: refreshLicenseStats
      responses:
        '200':
          $ref: '#/components/responses/refreshLicenseStatsResponse'
        '500':
          $ref: '#/components/responses/internalServerError'
  /licensing/token:
    get:
      description: You need to have a permission with action `licensing:read`.
      tags:
      - Enterprise
      summary: Get license token
      operationId: getLicenseToken
      responses:
        '200':
          $ref: '#/components/responses/getLicenseTokenResponse'
    post:
      description: You need to have a permission with action `licensing:write`.
      tags:
      - Enterprise
      summary: Create license token
      operationId: postLicenseToken
      responses:
        '200':
          $ref: '#/components/responses/getLicenseTokenResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTokenCommand'
        required: true
    delete:
