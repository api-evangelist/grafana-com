components:
  schemas:
    PrometheusRemoteWriteTargetJSON:
      type: object
      properties:
        data_source_uid:
          type: string
        id:
          type: string
        remote_write_path:
          type: string
    Duration:
      description: 'A Duration represents the elapsed time between two instants

        as an int64 nanosecond count. The representation limits the

        largest representable duration to approximately 290 years.'
      type: integer
      format: int64
    SetUserRolesCommand:
      type: object
      properties:
        global:
          type: boolean
        includeHidden:
          type: boolean
        roleUids:
          type: array
          items:
            type: string
    ErrorResponseBody:
      type: object
      required:
      - message
      properties:
        error:
          description: Error An optional detailed description of the actual error. Only included if running in developer mode.
          type: string
        message:
          description: a human readable version of the error
          type: string
        status:
          description: 'Status An optional status to denote the cause of the error.


            For example, a 412 Precondition Failed error may include additional information of why that error happened.'
          type: string
    TokenStatus:
      type: integer
      format: int64
    UpdateTeamLBACCommand:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TeamLBACRule'
    ReportSettings:
      type: object
      properties:
        branding:
          $ref: '#/components/schemas/ReportBrandingOptions'
        embeddedImageTheme:
          type: string
        footerFontFamily:
          type: string
        footerItems:
          type: array
          items:
            $ref: '#/components/schemas/FooterItem'
        id:
          type: integer
          format: int64
        orgId:
          type: integer
          format: int64
        pdfDashboardTitleEnabled:
          type: boolean
        pdfHeaderEnabled:
          type: boolean
        pdfTheme:
          type: string
        pdfTimeRangeEnabled:
          type: boolean
        userId:
          type: integer
          format: int64
    RoleDTO:
